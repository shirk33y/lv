name: build

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .release-please-manifest.json
      - .github/workflows/release.yml
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to republish, for example v0.1.7.
        required: false
        type: string
      smoke_only:
        description: Run build + smoke without publishing a release.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_meta:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect release commit
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FORCE_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$FORCE_RELEASE_TAG" ]; then
            VERSION=${FORCE_RELEASE_TAG#v}
            test -n "$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$FORCE_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'map(select(.merged_at != null and (.title | startswith("chore(main): release")))) | first | .number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  build-flatpak:
    name: build-flatpak (${{ matrix.arch }})
    needs: release_meta
    if: needs.release_meta.outputs.release == 'true' || github.event.inputs.smoke_only == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            timeout: 90
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 120
    env:
      CONTAINER_RUNTIME: docker
      FLATPAK_ARCH: ${{ matrix.arch }}
      FLATPAK_PLATFORM: ${{ matrix.platform }}
      FLATPAK_FORCE_CLEAN: "0"
      FLATPAK_STATE_DIR: build/flatpak-state
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Flatpak state
        uses: actions/cache@v5
        with:
          path: |
            build/flatpak-state
            build/flatpak-home
            ~/.cache/flatpak
          key: flatpak-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'extra/flatpak/io.github.shirk33y.lv.json', 'extra/flatpak/flatpak-cargo-generator.py', 'scripts/build-flatpak.sh') }}
          restore-keys: |
            flatpak-${{ runner.os }}-${{ matrix.arch }}-

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        env:
          FLATPAK_BUNDLE: build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
        run: make flatpak-build

      - name: Create checksum
        run: |
          cd build
          sha256sum lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak > lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
            build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256
          retention-days: 7

  smoke-flatpak:
    name: smoke-flatpak (${{ matrix.arch }})
    needs: [release_meta, build-flatpak]
    if: needs.release_meta.outputs.release == 'true' || github.event.inputs.smoke_only == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            timeout: 35
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 45
    env:
      CONTAINER_RUNTIME: docker
      FLATPAK_ARCH: ${{ matrix.arch }}
      FLATPAK_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: flatpak-${{ matrix.arch }}
          path: build

      - name: Verify checksum
        run: |
          cd build
          sha256sum -c lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build smoke image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: docker/Dockerfile.flatpak-smoke
          platforms: ${{ matrix.platform }}
          load: true
          tags: lv-flatpak-smoke-${{ matrix.arch }}
          build-args: |
            FLATPAK_BUNDLE=build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          cache-from: type=gha,scope=flatpak-smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=flatpak-smoke-${{ matrix.arch }}

      - name: Smoke test Flatpak
        env:
          FLATPAK_BUNDLE: build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          LV_SMOKE_LOG_DIR: build/flatpak-smoke-logs/${{ matrix.arch }}
        run: |
          mkdir -p "$LV_SMOKE_LOG_DIR"
          docker run --rm --privileged \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE/$LV_SMOKE_LOG_DIR:/smoke-logs:rw" \
            lv-flatpak-smoke-${{ matrix.arch }} \
            bash -lc 'FLATPAK_BUNDLE=/tmp/lv.flatpak LV_FIXTURES=/fixtures LV_SMOKE_LOG_DIR=/smoke-logs bash /scripts/smoke-test-flatpak.sh'

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: flatpak-smoke-logs-${{ matrix.arch }}
          path: build/flatpak-smoke-logs/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish-flatpaks
    needs: [release_meta, smoke-flatpak]
    if: needs.release_meta.outputs.release == 'true' && github.event.inputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.release_meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: flatpak-*
          path: artifacts

      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'map(select(.merged_at != null and (.title | startswith("chore(main): release")))) | first | .number')
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body' > /tmp/release-pr-body.txt
          awk '
            /^---$/ {
              if (seen == 0) {
                seen = 1
                next
              }
              exit
            }
            seen { print }
          ' /tmp/release-pr-body.txt > release-notes.md
          test -s release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --target "${{ github.sha }}" --notes-file release-notes.md
          fi

      - name: Upload release assets
        run: |
          find artifacts -type f \( -name '*.flatpak' -o -name '*.sha256' \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber

      - name: Verify release assets
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-x86_64.flatpak" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-x86_64.flatpak.sha256" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-aarch64.flatpak" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-aarch64.flatpak.sha256" assets.txt

      - name: Summary
        run: |
          REPO="https://github.com/${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          {
            echo "## Published $TAG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Release** | [$REPO/releases/tag/$TAG]($REPO/releases/tag/$TAG) |"
            echo "| **Tag** | [\`$TAG\`]($REPO/tree/$TAG) |"
            echo "| **Commit** | [\`$SHORT_SHA\`]($REPO/commit/$SHA) |"
            echo ""
            echo "### Flatpak assets"
            find artifacts -type f \( -name '*.flatpak' -o -name '*.sha256' \) -printf '- `%f`\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
