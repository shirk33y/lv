name: build

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-flatpak:
    name: build-flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            timeout: 90
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 120
    env:
      CONTAINER_RUNTIME: docker
      FLATPAK_ARCH: ${{ matrix.arch }}
      FLATPAK_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        env:
          FLATPAK_BUNDLE: build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
        run: make flatpak-build

      - name: Create checksum
        run: |
          cd build
          sha256sum lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak > lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
            build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256
          retention-days: 7

  smoke-flatpak:
    name: smoke-flatpak (${{ matrix.arch }})
    needs: build-flatpak
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            timeout: 35
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            timeout: 45
    env:
      CONTAINER_RUNTIME: docker
      FLATPAK_ARCH: ${{ matrix.arch }}
      FLATPAK_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: build

      - name: Verify checksum
        run: |
          cd build
          sha256sum -c lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak.sha256

      - name: Smoke test Flatpak
        env:
          FLATPAK_BUNDLE: build/lv-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          LV_SMOKE_LOG_DIR: build/flatpak-smoke-logs/${{ matrix.arch }}
        run: make flatpak-smoke

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-smoke-logs-${{ matrix.arch }}
          path: build/flatpak-smoke-logs/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish-flatpaks
    needs: smoke-flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: artifacts

      - name: Upload release assets
        run: |
          find artifacts -type f \( -name '*.flatpak' -o -name '*.sha256' \) -print0 \
            | xargs -0 gh release upload "$TAG"

      - name: Verify release assets
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-x86_64.flatpak" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-x86_64.flatpak.sha256" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-aarch64.flatpak" assets.txt
          grep -Fx "lv-${{ steps.version.outputs.version }}-aarch64.flatpak.sha256" assets.txt

      - name: Summary
        run: |
          REPO="https://github.com/${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          {
            echo "## Published $TAG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Release** | [$REPO/releases/tag/$TAG]($REPO/releases/tag/$TAG) |"
            echo "| **Tag** | [\`$TAG\`]($REPO/tree/$TAG) |"
            echo "| **Commit** | [\`$SHORT_SHA\`]($REPO/commit/$SHA) |"
            echo ""
            echo "### Flatpak assets"
            find artifacts -type f \( -name '*.flatpak' -o -name '*.sha256' \) -printf '- `%f`\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
